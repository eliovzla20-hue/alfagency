<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrar · Panel Alfa Agency</title>
<link rel="icon" href="/panel/logo-a.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:Poppins,system-ui,sans-serif;color:#0b1b3a;background:#fff;display:flex}
.lado{flex:1 1 50%;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(60% 50% at 80% 10%,rgba(32,159,244,.22),transparent 65%),radial-gradient(55% 50% at 10% 95%,rgba(0,61,145,.45),transparent 70%),linear-gradient(168deg,#041027,#010916 62%,#00040f)}
.lado img{height:46px;width:auto}
.lado h1{font-size:clamp(30px,3.4vw,46px);font-weight:600;line-height:1.12;letter-spacing:-.01em;max-width:14ch}
.lado h1 em{font-style:normal;color:#209ff4}
.lado p{color:#a9badb;font-weight:300;max-width:40ch;margin-top:14px}
.lado small{color:#6f84ad;font-size:13px}
.form{flex:1 1 50%;display:flex;align-items:center;justify-content:center;padding:40px 24px}
form{width:min(380px,100%)}
form img{height:38px;width:auto;margin-bottom:34px}
h2{font-size:24px;font-weight:600}
.sub{color:#5a6b8c;font-size:14px;margin:6px 0 28px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}
.campo{position:relative}
input{width:100%;font:inherit;font-size:15px;padding:13px 46px 13px 14px;border:1px solid #d5ddeb;border-radius:10px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:#209ff4;box-shadow:0 0 0 4px rgba(32,159,244,.15)}
.ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:8px;color:#5a6b8c;cursor:pointer;border-radius:8px}
.ver:hover{background:#f0f4fa;color:#002063}
.ver svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
button[type=submit]{width:100%;margin-top:18px;font:inherit;font-weight:500;font-size:15px;color:#fff;background:#002063;border:0;border-radius:10px;padding:13px;cursor:pointer;transition:background .15s,transform .1s}
button[type=submit]:hover{background:#003d91}
button[type=submit]:active{transform:scale(.98)}
button[disabled]{opacity:.6;cursor:wait}
.error{color:#c62828;font-size:13px;margin-top:12px;min-height:20px}
@media (max-width:820px){.lado{display:none}}
</style>
</head>
<body>
<section class="lado">
  <img src="/panel/logo-a.png" alt="Alfa Agency">
  <div>
    <h1>Panel de la <em>web</em></h1>
    <p>Visitas, de dónde llegan, qué servicios miran y cuántas personas escriben por WhatsApp.</p>
  </div>
  <small>alfaagencyy.com</small>
</section>
<section class="form">
  <form id="f" autocomplete="on">
    <img src="/panel/logo-alfa.png" alt="Alfa Agency">
    <h2>Entrar al panel</h2>
    <p class="sub">Escribe la clave del equipo.</p>
    <label for="clave">Clave</label>
    <div class="campo">
      <input id="clave" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="ver" type="button" id="ver" aria-label="Mostrar clave"><svg viewBox="0 0 24 24"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button type="submit" id="ir">Entrar</button>
    <p class="error" id="error" role="alert"></p>
  </form>
</section>
<script>
(function () {
  var f = document.getElementById('f'), c = document.getElementById('clave'), ir = document.getElementById('ir'), err = document.getElementById('error');
  document.getElementById('ver').onclick = function () { c.type = c.type === 'password' ? 'text' : 'password'; c.focus(); };
  f.onsubmit = function (e) {
    e.preventDefault(); err.textContent = ''; ir.disabled = true; ir.textContent = 'Entrando…';
    fetch('/api/panel/entrar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ clave: c.value }) })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.ok) location.href = '/panel/'; else throw new Error(d.error); })
      .catch(function (x) { err.textContent = x.message || 'No se pudo entrar.'; ir.disabled = false; ir.textContent = 'Entrar'; c.select(); });
  };
})();
</script>
</body>
</html>
