<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070b16" id="color-tema">
<title>Panel de la web · Alfa Agency</title>
<link rel="icon" href="/panel/logo-a.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/panel/estilos.css?v=3">
<script>try { var q = (location.search.match(/[?&]tema=(claro|oscuro)/) || [])[1]; if (q) localStorage.setItem('alfa-panel-tema', q); var t = localStorage.getItem('alfa-panel-tema'); if (t === 'claro' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.classList.add('claro'); if (localStorage.getItem('alfa-panel-plegado') === '1') document.documentElement.classList.add('plegado'); } catch (e) {}</script>
</head>
<body>
<div class="marco">
  <aside class="lateral vidrio" id="lateral">
    <div class="marca">
      <span class="marca__ic"><img src="/panel/logo-a.png" alt=""></span>
      <div class="marca__txt"><b>Alfa Agency</b><small>Panel de la web</small></div>
      <button class="btn-ic plegar" id="plegar" aria-label="Plegar menú" title="Plegar menú"><svg class="ic"><use href="#i-panel"/></svg></button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="lateral__pie">
      <div class="vivo-card" id="vivo-card">
        <small>En la web ahora</small>
        <b id="vivo-num">—</b>
        <span><i class="punto"></i><span id="vivo-txt">últimos 30 minutos</span></span>
      </div>
      <div class="tema" id="tema" role="group" aria-label="Apariencia">
        <button type="button" data-tema="claro" title="Modo claro"><svg class="ic"><use href="#i-sol"/></svg><span>Claro</span></button>
        <button type="button" data-tema="oscuro" title="Modo oscuro"><svg class="ic"><use href="#i-luna"/></svg><span>Oscuro</span></button>
      </div>
      <div class="usuario">
        <span class="avatar">AA</span>
        <div><b>Equipo Alfa</b><small>alfaagencyy.com</small></div>
        <a class="btn-ic" href="/api/panel/salir" aria-label="Salir" title="Salir"><svg class="ic"><use href="#i-salir"/></svg></a>
      </div>
    </div>
  </aside>
  <div class="velo" id="velo"></div>

  <main class="contenido">
    <header class="barra">
      <button class="btn-ic redondo abrir-menu" id="abrir-menu" aria-label="Abrir menú"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="miga"><span id="miga-saludo">Hola, equipo</span><i>/</i><b id="miga-vista">Resumen</b></div>
      <label class="buscar">
        <svg class="ic"><use href="#i-buscar"/></svg>
        <input id="buscar" type="search" placeholder="Ir a una sección…" autocomplete="off" list="secciones" aria-label="Ir a una sección">
        <kbd>⌘K</kbd>
        <datalist id="secciones"></datalist>
      </label>
      <div class="reloj" id="reloj" aria-live="off">
        <svg class="ic"><use href="#i-calendario"/></svg>
        <span id="fecha"></span><i></i><b id="hora"></b>
      </div>
      <div class="barra__acciones">
        <button class="btn-ic redondo" id="refrescar" aria-label="Actualizar datos" title="Actualizar datos"><svg class="ic"><use href="#i-revisar"/></svg></button>
        <a class="btn-ic redondo" href="https://www.alfaagencyy.com/?nomedir" target="_blank" rel="noopener" aria-label="Abrir la web" title="Abrir la web"><svg class="ic"><use href="#i-externo"/></svg></a>
        <a class="pill acento" href="#enlaces"><svg class="ic"><use href="#i-mas"/></svg><span>Crear enlace</span></a>
        <span class="avatar claro-av">AA</span>
      </div>
    </header>

    <div class="titular">
      <div><h1 id="titulo">Resumen</h1><p id="subtitulo"></p></div>
      <div class="titular__acciones">
        <button class="pill borde" id="exportar"><svg class="ic"><use href="#i-descarga"/></svg><span>Exportar</span></button>
        <div class="segmento" id="periodo" role="group" aria-label="Periodo">
          <button data-dias="7">7D</button><button data-dias="28">28D</button><button data-dias="90">90D</button><button data-dias="365">1A</button>
        </div>
      </div>
    </div>
    <div id="aviso"></div>
    <div id="vista" aria-live="polite"></div>
  </main>
</div>
<div class="globo" id="globo" role="tooltip"></div>
